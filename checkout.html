<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Zero Hunger</title>
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Modern Navigation Bar -->
    <nav class="navbar">
        <a href="Home.html" class="nav-brand">
            <img src="images/Logo.png" alt="Zero Hunger Logo">
        </a>
        <div class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Login.html">Login</a>
            <a href="shop.html">Shop</a>
            <a href="gallery.html">Gallery</a>
            <a href="sitemap.html">Sitemap</a>
            <a href="Feedback.html">Feedback</a>
            <a href="aboutus.html">About us</a>
        </div>

    </nav>

    <div class="checkout-container">
        <h1 class="page-title">CHECKOUT</h1>
        
        <div class="checkout-layout">
            <!-- Left Side - Cart Items -->
            <div class="cart-section">
                <div class="section-card">
                    <h2 class="section-title">YOUR CART</h2>
                    <div class="cart-items list"></div>
                    <button class="back-btn backToShopButton">
                        <span>← BACK TO SHOP</span>
                    </button>
                </div>
            </div>

            <!-- Right Side - Checkout Form -->
            <div class="form-section">
                <div class="section-card">
                    <h2 class="section-title">SHIPPING INFORMATION</h2>
                    
                    <div class="checkout-form form">
                        <div class="form-group Group">
                            <label for="Name">Full Name</label>
                            <input type="text" name="Name" id="Name" required>
                        </div>

                        <div class="form-group Group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" name="phone" id="phone" required>
                        </div>

                        <div class="form-group Group">
                            <label for="email">Email Address</label>
                            <input type="email" placeholder="example@gmail.com" name="email" id="email" required>
                        </div>

                        <div class="form-group Group">
                            <label for="Address">Delivery Address</label>
                            <input type="text" name="Address" id="Address" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group Group">
                                <label for="Country">Country</label>
                                <select name="Country" id="Country" required>
                                    <option value="">Choose...</option>
                                    <option value="Sri Lanka">Sri Lanka</option>
                                </select>
                            </div>

                            <div class="form-group Group">
                                <label for="City">City</label>
                                <select name="City" id="City" required>
                                    <option value="">Choose...</option>
                                    <option value="Galle">Galle</option>
                                    <option value="Colombo">Colombo</option>
                                    <option value="Gampaha">Gampaha</option>
                                    <option value="Kandy">Kandy</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Order Summary -->
                    <div class="order-summary Summary">
                        <h3>ORDER SUMMARY</h3>
                        <div class="customer-info"></div>
                        <div class="product-Summary"></div>
                        
                        <div class="summary-totals return">
                            <div class="summary-row row">
                                <span class="Summary">Total Items:</span>
                                <span class="Total_Quantity">0</span>
                            </div>
                            <div class="summary-row row total-price-row">
                                <span class="Summary">Total Price:</span>
                                <span class="totalPrice">$0</span>
                            </div>
                        </div>
                    </div>

                    <button class="checkout-btn buttonCheckout">
                        <span>COMPLETE PURCHASE</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="myFooter">
        <div class="container">
            <h3>Zero Hunger</h3>
            <p>Yasith Chandeepa | Venojan | Ashen De Zoysa | Dishen Fernando</p>
            <p>Copyright &copy;2024 Zero Hunger</p>
        </div>
    </footer>

    <script src="js/checkout.js"></script>
</body>
</html>
